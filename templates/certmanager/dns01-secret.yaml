{{- if include "remnawave.certManager.cloudflare.create" . }}
{{- $ref := include "remnawave.certManager.cloudflare.secretRef" . | fromYaml }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ref.name }}
  namespace: {{ include "remnawave.certManager.issuerSecretNamespace" . }}
  labels:
    {{- include "remnawave.componentLabels" (dict "ctx" . "component" "tls") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{ $ref.key }}: {{ .Values.certManager.issuer.dns01.cloudflare.apiToken | b64enc }}
{{- end }}
