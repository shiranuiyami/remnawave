{{- if and .Values.valkey.enabled .Values.valkey.auth.enabled (not .Values.valkey.auth.existingSecret) }}
{{- $name := include "remnawave.valkey.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "remnawave.componentLabels" (dict "ctx" . "component" "valkey") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  password: {{ include "remnawave.persistentSecret" (dict "ctx" . "secret" $name "key" "password" "value" .Values.valkey.auth.password "length" 32) | b64enc }}
{{- end }}
