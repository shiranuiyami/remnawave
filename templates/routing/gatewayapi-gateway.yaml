{{- if and (eq .Values.routing.type "gatewayApi") .Values.routing.gatewayApi.createGateway }}
{{- $gw := .Values.routing.gatewayApi.gateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "remnawave.routing.gatewayApi.gatewayName" . }}
  labels:
    {{- include "remnawave.componentLabels" (dict "ctx" . "component" "routing") | nindent 4 }}
    {{- with $gw.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with merge (deepCopy $gw.annotations) .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ $gw.className }}
  {{- with $gw.infrastructure }}
  infrastructure:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  listeners:
    {{- if $gw.listeners }}
    {{- tpl (toYaml $gw.listeners) . | nindent 4 }}
    {{- else }}
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    {{- if .Values.routing.tls.enabled }}
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ include "remnawave.routing.tlsSecretName" . }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
    {{- end }}
{{- end }}
