{{- if eq .Values.routing.type "gatewayApi" }}
{{- $g := .Values.routing.gatewayApi }}
{{- $tls := .Values.routing.tls.enabled }}
{{- $parentRefs := $g.parentRefs }}
{{- if $g.createGateway }}
{{- $parentRefs = list (dict "name" (include "remnawave.routing.gatewayApi.gatewayName" .) "sectionName" (ternary "https" "http" $tls)) }}
{{- end }}
{{- $svc := include "remnawave.panel.fullname" . }}
{{- range $entry := include "remnawave.routing.model" . | fromYamlArray }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-%s" (include "remnawave.fullname" $) $entry.name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "remnawave.componentLabels" (dict "ctx" $ "component" "routing") | nindent 4 }}
    {{- with $g.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with merge (deepCopy $g.annotations) $.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $parentRefs | nindent 4 }}
  hostnames:
    - {{ $entry.host | quote }}
  rules:
    {{- range $entry.rules }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .path }}
      backendRefs:
        - name: {{ $svc }}
          port: {{ .port }}
      {{- with $g.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}

{{- /* HTTP -> HTTPS redirect */}}
{{- $redirectRefs := list }}
{{- if and $tls .Values.routing.tls.httpsRedirect }}
{{- if $g.createGateway }}
{{- $redirectRefs = list (dict "name" (include "remnawave.routing.gatewayApi.gatewayName" .) "sectionName" "http") }}
{{- else }}
{{- $redirectRefs = $g.httpRedirectParentRefs }}
{{- end }}
{{- end }}
{{- with $redirectRefs }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-https-redirect" (include "remnawave.fullname" $) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "remnawave.componentLabels" (dict "ctx" $ "component" "routing") | nindent 4 }}
    {{- with $g.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with merge (deepCopy $g.annotations) $.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml . | nindent 4 }}
  hostnames:
    {{- include "remnawave.routing.hosts" $ | nindent 4 }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
