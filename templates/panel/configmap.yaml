apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "remnawave.panel.fullname" . }}
  labels:
    {{- include "remnawave.componentLabels" (dict "ctx" . "component" "panel") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- include "remnawave.envData" (include "remnawave.panel.configEnv" . | fromYaml) | trim | nindent 2 }}
