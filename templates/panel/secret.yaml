apiVersion: v1
kind: Secret
metadata:
  name: {{ include "remnawave.panel.fullname" . }}
  labels:
    {{- include "remnawave.componentLabels" (dict "ctx" . "component" "panel") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- include "remnawave.envSecretData" (include "remnawave.panel.secretEnv" . | fromYaml) | trim | nindent 2 }}
