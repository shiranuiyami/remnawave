database:
  external:
    url: postgresql://remnawave:secret@pg.db.svc:5432/remnawave
routing:
  type: istio
  skipCrdCheck: true
  istio:
    gateways:
      - istio-system/public-gw
certManager:
  enabled: true
  skipCrdCheck: true
  issuer:
    create: false
    kind: ClusterIssuer
    name: letsencrypt-dns
    solver: dns01
