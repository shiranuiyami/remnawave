database:
  external:
    url: postgresql://remnawave:secret@pg.db.svc:5432/remnawave
routing:
  type: gatewayApi
  skipCrdCheck: true
  hosts:
    panel: panel.example.com
    sub: sub.example.com
  gatewayApi:
    createGateway: true
    gateway:
      className: cilium
certManager:
  enabled: true
  skipCrdCheck: true
subscriptionPage:
  enabled: true
  image:
    tag: "7.0.0"
  secretEnv:
    REMNAWAVE_API_TOKEN: token-from-panel-ui
  resources:
    requests: { cpu: 20m, memory: 64Mi }
