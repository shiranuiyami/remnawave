routing:
  type: gatewayApi
  skipCrdCheck: true
  hosts:
    panel: panel.example.com
  gatewayApi:
    parentRefs:
      - name: public-gw
        namespace: gateway-system
        sectionName: https
    httpRedirectParentRefs:
